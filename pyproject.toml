[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "schemadrift"
version = "0.1.0"
description = "CLI tool to detect schema drift between PostgreSQL databases and generate safe migration SQL"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Asad Shah", email = "asadshah7950@gmail.com" }]
keywords = ["postgresql", "schema", "migration", "diff", "database", "devops"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
  "psycopg2-binary>=2.9.9",
  "click>=8.1.7",
  "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=5.0.0",
  "pytest-mock>=3.14.0",
  "ruff>=0.4.0",
  "mypy>=1.10.0",
]

[project.scripts]
schemadrift = "schemadrift.cli:main"

[project.urls]
Homepage = "https://github.com/Asadshah7950/schemadrift"
Repository = "https://github.com/Asadshah7950/schemadrift"
"Bug Tracker" = "https://github.com/Asadshah7950/schemadrift/issues"

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=schemadrift --cov-report=term-missing --cov-fail-under=50"

[tool.coverage.run]
omit = ["schemadrift/cli.py", "schemadrift/inspector.py"]
